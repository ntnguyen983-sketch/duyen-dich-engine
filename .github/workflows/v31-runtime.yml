name: v3.1 Runtime
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run v3.1 tests
        run: PYTHONPATH=runtime/v31 python -m unittest discover -s runtime/v31 -p 'test_*.py' -v
