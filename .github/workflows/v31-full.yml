name: Duyên Dịch v3.1 Full End-to-End

on:
  push:
  pull_request:

jobs:
  v31-full:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m compileall -q app.py api runtime/v31

      - name: Run specification tests
        run: python -m unittest discover -s specs/v3.1/tests -p 'test_*.py' -v

      - name: Run runtime tests
        run: PYTHONPATH=runtime/v31 python -m unittest discover -s runtime/v31 -p 'test_*.py' -v

      - name: Run API schema and deterministic tests
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: python -m unittest -v test_api.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser test dependencies
        run: npm install && npx playwright install --with-deps chromium

      - name: Start API and UI server
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          nohup python3 app.py > /tmp/duyen-dich-v31.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat /tmp/duyen-dich-v31.log
          exit 1

      - name: Run Playwright browser tests
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v31-playwright-diagnostics
          path: |
            test-results/
            playwright-report/
            /tmp/duyen-dich-v31.log
