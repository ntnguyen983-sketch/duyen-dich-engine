<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duyên Dịch v3.1 UI Test</title><style>body{font-family:system-ui;margin:0;background:#f5f5f5;color:#222}main{max-width:900px;margin:auto;padding:20px}section{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 1px 4px #ccc}label{display:block;margin:10px 0 4px}input,textarea,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px}textarea{min-height:90px}button{margin-top:12px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pass{color:#087f23}.fail{color:#b00020}.mono{white-space:pre-wrap;font-family:monospace;font-size:12px;background:#111;color:#eee;padding:12px;border-radius:8px;overflow:auto}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><main>
<h1>Duyên Dịch v3.1 — Full UI Test</h1>
<section><label>Câu hỏi *</label><textarea id="question">tình cảm</textarea><div class="grid"><div><label>Number *</label><input id="number" value="369147" inputmode="numeric"></div><div><label>Time *</label><input id="time" type="datetime-local"></div></div><div class="grid"><div><label>GPS latitude</label><input id="lat" value="10.755124"></div><div><label>GPS longitude</label><input id="lng" value="106.616242"></div></div><label>Địa chỉ</label><input id="address" value=""><label>Ảnh</label><input id="image" type="file" accept="image/*" capture="environment"><button id="run">CHẠY V3.1</button></section>
<section><h2>UI Test</h2><div id="status">Chưa chạy</div><div id="checks"></div></section>
<section><h2>Canonical Output</h2><div id="out" class="mono">—</div></section>
<script>
const $=id=>document.getElementById(id); const canonical=['SAT','TA','NHIEU','HY','DUONG','AN'];
function nowLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)} $('time').value=nowLocal();
function check(name,ok,detail=''){return `<div class="${ok?'pass':'fail'}">${ok?'✓':'✗'} ${name}${detail?' — '+detail:''}</div>`}
async function run(){
 $('status').textContent='Đang chạy…'; const image=$('image').files[0]; const payload={question:$('question').value,number:Number($('number').value),time:new Date($('time').value).toISOString(),gps:($('lat').value&&$('lng').value)?{lat:Number($('lat').value),lng:Number($('lng').value)}:null,address:$('address').value,image:image?{name:image.name,type:image.type,size:image.size}:null};
 let r; try { const base=location.origin; const resp=await fetch(base+'/api/v31',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}); if(!resp.ok)throw Error('HTTP '+resp.status); r=await resp.json(); } catch(e){$('status').innerHTML='<span class="fail">✗ API FAIL</span>'; $('checks').innerHTML=check('API reachable',false,e.message); $('out').textContent=JSON.stringify({payload,error:e.message},null,2);return}
 const checks=[]; checks.push(check('L1',r.layers?.L1?.status==='PASSED')); checks.push(check('L2',String(r.layers?.L2?.status||'').startsWith('PASSED'))); checks.push(check('L3',String(r.layers?.L3?.status||'').startsWith('PASSED'))); checks.push(check('L4',canonical.includes(r.semantic_state?.primary_label))); checks.push(check('L5 canonical',r.layers?.L5?.canonical===true)); checks.push(check('L6 API ready',r.layers?.L6?.api_ready===true)); checks.push(check('contract 3.1',r.contract_version==='3.1.0')); checks.push(check('confidence firewall',r.uncertainty?.confidence?.f_net_out_excluded===true)); checks.push(check('deterministic input hash',!!r.execution?.input_hash)); checks.push(check('GPS accepted',payload.gps===null || (r.layers?.L1 && 'question' in r.layers.L1))); checks.push(check('image accepted',payload.image===null || (r.layers?.L1 && 'question' in r.layers.L1))); checks.push(check('canonical vocabulary only',canonical.includes(r.layers?.L4?.primary_label))); $('checks').innerHTML=checks.join(''); const bad=checks.filter(x=>x.includes('fail')).length; $('status').innerHTML=bad?'<span class="fail">FAIL</span>':'<span class="pass">PASS — '+checks.length+' checks</span>'; $('out').textContent=JSON.stringify(r,null,2);
} $('run').onclick=run;
</script></main></body></html>
